name: Project or feature proposal / 项目提案
description: 提出新项目、研究方向或较大功能改动
title: "[Proposal] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 说明目标对象、现状和为什么值得解决。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 目标与范围
      description: 描述预期成果、最小可行范围和明确不做的内容。
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: 验收与验证
      description: 给出可检查的完成标准、测试方法或研究指标。
    validations:
      required: true
  - type: textarea
    id: resources
    attributes:
      label: 资源、许可与风险
      description: 说明数据、模型、依赖、计算资源、费用、许可和隐私边界；没有信息时写待讨论。
    validations:
      required: false
  - type: textarea
    id: collaboration
    attributes:
      label: 协作方式
      description: 写明需要的技能、你愿意承担的部分和需要的评审支持；无需提交个人资料。
    validations:
      required: false
